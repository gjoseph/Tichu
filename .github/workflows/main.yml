name: Tichu build

on:
  push:
    branches: [main]
  pull_request:
    # By default, a workflow only runs when a pull_request's activity type is opened, synchronize, or reopened
    # With types: [opened], we only run on open, so further pushes do not re-trigger, to avoid completely overloading CI
    # types: [opened]
    # Unfortunately, manual triggers do not propagate to PR checks :|
    # TODO: alternatively, we could branches-ignore: [renovate/**] but that would need to be on the push event?
    branches: [main]
  # Enable manual triggers:
  workflow_dispatch:

jobs:
  build-backend:
    name: Backend w/ Java ${{ matrix.java-version-label }} ${{ matrix.experimental && '🧪' || '📍' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }} # if experimental, don't fail the whole job
    strategy:
      fail-fast: true # cancel other jobs if one in matrix fails
      matrix:
        include:
          # Default job that matches mise.toml
          - java-version: ""
            java-version-label: "(default)"
            experimental: false
          - java-version: "temurin-25"
            java-version-label: "Temurin 25"
            experimental: false
          # All graalvm jobs are experimental
          - java-version: "graalvm-community-25"
            java-version-label: "GraalVM 25"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        name: Set up Mise environment
        with:
          cache: true
      - name: Backend Build
        run: mise x java@${{ matrix.java-version }} -- ./mvnw clean verify -B -V -Darchunit.freeze.store.default.allowStoreUpdate=false
      - name: OpenRewriteCheck
        run: mise x java@${{ matrix.java-version }} -- ./mvnw rewrite:dryRun -DfailOnDryRunResults=true # Ensure no OpenRewrite rule/change hasn't been committed

  build-frontend:
    name: Frontend ${{ matrix.npm-command }} 📍
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # continue other jobs if one in matrix fails
      matrix:
        npm-command: [
            "lint",
            "build",
            "test",
            "prettier-check-all",
            "web-build-storybook", # we want to build storybook to ensure it continues working, while we have no tests for it
          ]
    defaults:
      run:
        working-directory: ./tichu-clients
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install
      - run: pnpm run ${{ matrix.npm-command }}
